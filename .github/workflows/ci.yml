name: WinnerLens CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      run: npm install

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Build
      run: npm run build
      env:
        # 빌드 과정에서 타입 체크 등을 위해 더미 환경변수가 필요할 수 있음
        DATABASE_URL: "postgresql://user:password@localhost:5432/winnerlens"
        JWT_SECRET: "ci-test-secret"

    - name: 🎉 Backend Build Success
      if: success()
      run: |
        echo "✅ Backend build completed successfully!"
        echo "📦 Build artifacts ready for deployment"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm install

    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: "http://localhost:3000/api/v1"
        # 빌드 중 ESLint 에러 무시 설정은 next.config.js에 이미 되어 있음

    - name: 🎉 Frontend Build Success
      if: success()
      run: |
        echo "✅ Frontend build completed successfully!"
        echo "📦 Build artifacts ready for deployment"
        echo "📊 GitHub Repository: https://github.com/minjae-488/WinnerLens"
        echo "🐛 Issues: https://github.com/minjae-488/WinnerLens/issues"

  build-summary:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: always()
    
    steps:
    - name: 📋 Build Summary
      run: |
        echo "## 🏗️ WinnerLens Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Build Status" >> $GITHUB_STEP_SUMMARY
        echo "- Backend: ${{ needs.backend-build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Frontend: ${{ needs.frontend-build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
        echo "- 🚀 [Getting Started](https://github.com/minjae-488/WinnerLens#-시작하기-getting-started)" >> $GITHUB_STEP_SUMMARY
        echo "- 📖 [Documentation](https://github.com/minjae-488/WinnerLens/blob/main/README.md)" >> $GITHUB_STEP_SUMMARY
        echo "- 🐛 [Report Issues](https://github.com/minjae-488/WinnerLens/issues)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "💡 **Live Demo Coming Soon!**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "Built with ❤️ by WinnerLens Team" >> $GITHUB_STEP_SUMMARY


